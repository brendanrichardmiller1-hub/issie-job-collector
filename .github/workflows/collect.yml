name: Collect jobs

on:
  schedule:
    # Three chances each night (UTC). GitHub sometimes starts scheduled runs
    # hours late or skips them, so the earlier runs are a safety net; each run
    # refreshes the data and Claude reads whatever is newest at 07:13 UK time.
    - cron: "20 1 * * *"
    - cron: "20 3 * * *"
    - cron: "40 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python collect.py

      - name: Save results
        run: |
          git config user.name "job-collector"
          git config user.email "job-collector@users.noreply.github.com"
          git add data
          git commit -m "Jobs collected $(date -u +%F)" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
